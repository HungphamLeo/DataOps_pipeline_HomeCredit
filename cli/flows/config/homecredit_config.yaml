project_params:
  environment: ${HOME_CREDIT_ENV:-development}
  logger_config: log/config/logger_config.yaml
  paths:
    source_dir: cli/ingestion/source_data
    design_metadata: cli/ingestion/design_modelling/Design modeling_doc.csv
    ge_root_dir: platforms/great_expectations
  runtime:
    retries: 2
    retry_delay_seconds: 30
    load_date_format: "%Y-%m-%d"
    csv_encoding: UTF-8
  postgres:
    host: ${POSTGRES_HOST:-localhost}
    port: ${POSTGRES_PORT:-5432}
    database: ${POSTGRES_DB:-homecredit_mart}
    user: ${POSTGRES_USER:-admin}
    password: ${POSTGRES_PASSWORD:-admin123}
    schema: stg
    jdbc_driver: org.postgresql.Driver
    write_mode: overwrite
  bronze:
    excluded_files:
      - sample_submission.csv
      - HomeCredit_columns_description.csv
    infer_schema: true
  staging:
    write_mode: overwrite
    date_dimension:
      start_date: "2020-01-01"
      end_date: "2030-12-31"
