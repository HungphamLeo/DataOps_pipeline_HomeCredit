project_params:
  environment: ${HOME_CREDIT_ENV:-development}
  logger_config: log/config/logger_config.yaml
  paths:
    source_dir: cli/ingestion/source_data
    design_metadata: cli/ingestion/design_modelling/Design modeling_doc.csv
    ge_root_dir: platforms/great_expectations
  runtime:
    retries: 2
    retry_delay_seconds: 30
    load_date_format: "%Y-%m-%d"
    csv_encoding: UTF-8
  postgres:
    host: ${POSTGRES_HOST:-localhost}
    port: ${POSTGRES_PORT:-5432}
    database: ${POSTGRES_DB:-homecredit_mart}
    user: ${POSTGRES_USER:-admin}
    password: ${POSTGRES_PASSWORD:-admin123}
    schema: stg
    jdbc_driver: org.postgresql.Driver
    write_mode: overwrite
  bronze:
    excluded_files:
      - sample_submission.csv
      - HomeCredit_columns_description.csv
    infer_schema: true
  # Home Credit dataset — domain-specific configuration
# Owned by: cli/flows (ingestion domain)
  bronze_maintenance:
    retention_hours: 168   # 7 ngày — business SLA
    tables:
      application:
        zorder_col: SK_ID_CURR
      bureau:
        zorder_col: SK_ID_CURR
      bureau_balance:
        zorder_col: SK_ID_BUREAU
      previous_application:
        zorder_col: SK_ID_CURR
      installments_payments:
        zorder_col: SK_ID_PREV
      pos_cash_balance:
        zorder_col: SK_ID_PREV
      credit_card_balance:
        zorder_col: SK_ID_PREV
  pii_security:
    enabled: true
    tables:
      application_train:
        encrypted_columns:
          - "AMT_INCOME_TOTAL"
          - "DAYS_BIRTH"
      application_test:
        encrypted_columns:
          - "AMT_INCOME_TOTAL"
          - "DAYS_BIRTH"
  staging:
    write_mode: overwrite
    date_dimension:
      start_date: "2020-01-01"
      end_date: "2030-12-31"
