environment: ${HOME_CREDIT_ENV:-development}

minio:
  endpoint: ${MINIO_ENDPOINT:-localhost:9000}
  access_key: ${MINIO_ROOT_USER:-minioadmin}
  secret_key: ${MINIO_ROOT_PASSWORD:-minioadmin123}
  secure: false
  bucket: ${MINIO_BUCKET:-lakehouse}
  bronze_prefix: bronze

spark:
  app_name: homecredit-bronze-silver
  master: ${SPARK_MASTER:-local[*]}
  driver_memory: ${SPARK_DRIVER_MEMORY:-4g}
  executor_memory: ${SPARK_EXECUTOR_MEMORY:-4g}
  packages:
    - io.delta:delta-spark_2.12:3.1.0
    - org.apache.hadoop:hadoop-aws:3.3.4
    - org.postgresql:postgresql:42.7.3
